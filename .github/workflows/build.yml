# CI principal: compila toda a implementação C e executa os testes.
# O objetivo é detectar regressões de compilação antes que mudanças cheguem à main.

name: C build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev
      - name: Test shared configuration code
        run: make test
      - name: Build GUI and daemon
        run: make
